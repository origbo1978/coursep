<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input[type=text], input[type=password], input[type=email] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background: #28a745;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background: #218838; }
        .login-link { text-align: center; margin-top: 15px; }
        .login-link a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2 style="text-align:center; color:#333; margin-bottom:20px;">Create Account</h2>

    <form method="POST" id="signupForm">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Signup</button>
    </form>

    <div class="login-link">
        <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </div>
</div>

<!-- 1. LOAD SWEETALERT2 AT THE END -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- 2. RUN ONLY AFTER PAGE + SWEETALERT LOADS -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Only show alert if Django sent messages
        {% if messages %}
            let hasShown = false;

            {% for message in messages %}
                {% if not hasShown %}
                    Swal.fire({
                        icon: '{{ message.tags }}',
                        title: '{{ message.tags|capfirst }}',
                        text: '{{ message|escapejs }}',
                        confirmButtonText: 'OK',
                        allowOutsideClick: false
                    }).then((result) => {
                        {% if 'success' in message.tags %}
                            if (result.isConfirmed) {
                                window.location.href = "{% url 'login' %}";
                            }
                        {% endif %}
                    });
                    hasShown = true;  // Prevent duplicate popups
                {% endif %}
            {% endfor %}
        {% endif %}
    });
</script>

</body>
</html>

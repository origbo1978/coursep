<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sk Academy{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; }
    </style>
</head>
<body>

    <!-- NAVBAR (copy-paste forever, never touch again) -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">Sk Academy</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Academics</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="{% url 'courses' %}">My Courses</a></li>
                            <li><a class="dropdown-item" href="{% url 'profile_view' %}">Profile</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex me-3" action="{% url 'courses' %}" method="GET">
                    <input class="form-control me-2" type="search" name="q" placeholder="Search...">
                    <button class="btn btn-outline-primary" type="submit">Search</button>
                </form>
                {% if user.is_authenticated %}
                    <span class="me-3">Hi, <strong>{{ user.username }}</strong></span>
                    <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-danger">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-sm btn-outline-success">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    {% block content %}
    {% endblock %}

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <p class="mb-0">© 2025 skyeo. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
